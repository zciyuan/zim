# Build the 11 IM binaries. The single runtime image is assembled by deploy/docker/Dockerfile.
version: 2

project_name: zim

builds:
  - id: zim-gate
    main: ./cmd/zim-gate
    binary: zim-gate
    env: [CGO_ENABLED=0]
    goos: [linux]
    goarch: [amd64, arm64]
    ldflags:
      - -s -w
      - -X github.com/zciyuan/ZIM/internal/version.Version={{ .Version }}
      - -X github.com/zciyuan/ZIM/internal/version.Commit={{ .Commit }}
      - -X github.com/zciyuan/ZIM/internal/version.BuildTime={{ .Date }}
  - id: zim-node-msg
    main: ./cmd/zim-node-msg
    binary: zim-node-msg
    env: [CGO_ENABLED=0]
