syntax = "proto3";

package zim.protocol.message;

option go_package = "github.com/zciyuan/ZIM/internal/protocol/message;msgpb";

message MessageItem {
  string server_msg_id = 1;
  string client_msg_id = 2;
  string conversation_id = 3;
  int64 seq = 4;
  int64 send_id = 5;
  int64 recv_id = 6;
  int64 group_id = 7;
  int32 msg_type = 8;
  string content = 9;
  repeated string at_user_ids = 10;
  int64 send_time = 11;
  int32 status = 12;
  repeated Reaction reactions = 13;
  // ADR-0043 reserved ranges: 50-59 burn, 60-69 security, 70-79 ext card.
  int32  burn_ttl       = 50; // >0 = burn after reading, seconds
  int64  burn_expire_at = 51; // absolute destroy time (UTC ms); 0 = not counting yet
  bool   is_burned      = 52; // content destroyed (SyncMissing tombstone)
  uint32 security_flags = 60; // 1 no-forward 2 no-copy 4 no-save 8 no-search 16 anti-screenshot
  int32  ext_type       = 70; // 1 red packet card / 2 tip card / 3 voice-room card
  string ext_payload    = 71; // JSON card payload
}

message SendSingleReq {
  string client_msg_id = 1;
  int64 recv_id = 2;
  int32 msg_type = 3;
  string content = 4;
  bool no_offline = 5;
  bool no_notification = 6;
  bool read_receipt = 7;
  int32 burn_ttl = 8; // ADR-0043: >0 = burn after reading
  int32 ext_type = 9; // business card: 1 red packet / 2 tip / 3 voice room
  string ext_payload = 10;
}

message SendSingleRes {
  string server_msg_id = 1;
  int64 seq = 2;
  int64 send_time = 3;
  int64 burn_expire_at = 4; // 0 unless group-style immediate countdown applies
}

message SendGroupReq {
  string client_msg_id = 1;
  int64 group_id = 2;
  int32 msg_type = 3;
  string content = 4;
  repeated string at_user_ids = 5;
  bool no_offline = 6;
  bool no_notification = 7;
  int32 burn_ttl = 8; // ADR-0043: group burn counts down from creation
  int32 ext_type = 9; // business card: 1 red packet / 2 tip / 3 voice room
  string ext_payload = 10;
}

message SendGroupRes {
  string server_msg_id = 1;
  int64 seq = 2;
  int64 send_time = 3;
  int64 unread_count = 4;
  int64 burn_expire_at = 5;
}

message PullBySeqReq {
  string conversation_id = 1;
  int64 begin_seq = 2;
  int64 end_seq = 3;
  int32 limit = 4;
}

message PullBySeqRes {
  repeated MessageItem messages = 1;
  bool has_more = 2;
}

message ReadReceiptReq {
  string conversation_id = 1;
  int64 seq = 2;
}

message ReadReceiptRes {
  int64 read_seq = 1;
}

message RecallReq {
  string conversation_id = 1;
  string server_msg_id = 2;
}

message OperationRes {
  bool ok = 1;
}

// 1507 编辑消息（仅发送者、仅在 2 分钟内）。
message EditMessageReq {
  string conversation_id = 1;
  string server_msg_id = 2;
  string content = 3;
}

// 1508 删除消息（仅发送者；对方看到「已删除」占位）。
message DeleteMessageReq {
  string conversation_id = 1;
  string server_msg_id = 2;
}

// 1512 会话内搜索。
message SearchMessageReq {
  string conversation_id = 1;
  string keyword = 2;
  int32 limit = 3;
}

message SearchMessageRes {
  repeated MessageItem messages = 1;
}

// 1515/1516 表情回应：同一 (conversation, seq, uid, emoji) 唯一。
message AddReactionReq {
  string conversation_id = 1;
  string server_msg_id = 2;
  string emoji = 3;
}

message RemoveReactionReq {
  string conversation_id = 1;
  string server_msg_id = 2;
  string emoji = 3;
}

// Reaction 随 MessageItem 返回（1511/1512/1901）。
message Reaction {
  string emoji = 1;
  int32 count = 2;
  bool mine = 3;
}

// 1504 引用回复：server 端回填被引用消息的摘要，防止伪造。
message QuoteMessageReq {
  string client_msg_id = 1;
  int64  recv_id = 2;
  int64  group_id = 3;
  string server_msg_id = 4;
  string content = 5;
}

message QuoteMessageRes {
  string server_msg_id = 1;
  int64  seq = 2;
  int64  send_time = 3;
}

// 1503 合并转发：把多条消息合并成一张聊天记录卡片。
message MergeMessageReq {
  string          client_msg_id   = 1;
  int64           recv_id         = 2;
  int64           group_id        = 3;
  repeated string server_msg_ids  = 4;
  string          title           = 5;
}

message MergeMessageRes {
  string server_msg_id = 1;
  int64  seq           = 2;
  int64  send_time     = 3;
}

// 1906 已读同步推送（单聊）：对端读到 seq。
message ReadSyncPush {
  string conversation_id = 1;
  int64  uid             = 2;
  int64  read_seq        = 3;
}

// 1517 输入中状态（客户端上报，服务端只做转发）。
message TypingReq {
  string conversation_id = 1;
  bool   typing          = 2;
}

// 1908 输入中推送。
message TypingPush {
  string conversation_id = 1;
  int64  uid             = 2;
  bool   typing          = 3;
}

// 1909 好友事件推送（申请/同意/删除/拉黑）。
message FriendEventPush {
  int32 kind     = 1; // 1 request / 2 accepted / 3 deleted / 4 blocked / 5 unblocked
  int64 from_uid = 2;
  int64 to_uid   = 3;
}

// 1106 subscribe online status.
message SubscribeOnlineReq {
  repeated int64 uids = 1;
}

// 1106 online snapshot.
message SubscribeOnlineRes {
  repeated OnlineUser users = 1;
}

message OnlineUser {
  int64 uid    = 1;
  bool  online = 2;
}

// 1903 online status change.
message OnlineChangePush {
  int64 uid    = 1;
  bool  online = 2;
}

// 1518 阅后即焚已读上报：单聊接收方阅读后触发倒计时（ADR-0043）。
message BurnReadAckReq {
  string conversation_id = 1;
  string server_msg_id   = 2;
  int64  seq             = 3;
}

message BurnReadAckRes {
  int64 burn_expire_at = 1;
  int64 server_now_ms  = 2;
}

// 1910 倒计时开始推送（发给双方所有在线端，seq=0）。
message BurnTimerStartPush {
  string conversation_id = 1;
  string server_msg_id   = 2;
  int64  seq             = 3;
  int64  burn_expire_at  = 4;
  int64  server_now_ms   = 5;
}

// 1911 强制销毁推送（提前清理或到期兜底，seq=0）。
message BurnDeletePush {
  string conversation_id = 1;
  string server_msg_id   = 2;
  int64  seq             = 3;
}

// 1519 截屏/录屏上报（ADR-0043，群聊/单聊通用）。
message ScreenshotReportReq {
  string conversation_id = 1;
  int32  conv_type       = 2; // 1 single / 2 group
  int32  event_type      = 3; // 1 screenshot / 2 screen record start
  string device_info     = 4;
}

message ScreenshotReportRes {
  bool ok = 1;
}

// 1907 通用通知推送（seq=0）：DLP 灰条、阅后即焚会话提示等。
message NotifyPush {
  string conversation_id = 1;
  string content         = 2;
  int64  at              = 3;
}
