# ZIM zim-voiceroom bootstrap configuration.
# Run: ./build/bin/zim-voiceroom -etc ./configs/zim-voiceroom

pid = "./run/zim-voiceroom.pid"
mode = "debug"
timezone = "Local"
shutdownMaxWaitTime = "30s"

[zim.health]
    addr = ":8208"

[zim.postgres]
    dsn = "postgres://zim:zim@127.0.0.1:5432/zim?sslmode=disable"

[zim.voiceroom]
    seatCount = 8
    reconnectTimeoutMs = 30000
    emptyTimeoutMs = 300000
    roomTTL = "168h"
    sfuUrl = ""
    webhookAddr = ":8210"
    webhookSecret = ""
    livekitUrl = ""
    livekitApiKey = ""
    livekitApiSecret = ""
    livekitTokenTTL = "1h"

[locate.redis]
    addrs = ["127.0.0.1:6379"]
    prefix = "zim"

[cluster.mesh]
    name = "voiceroom"
    addr = ":0"
    codec = "proto"

[registry.nacos]
    urls = ["http://127.0.0.1:8848/nacos"]
    namespaceId = ""
    groupName = "ZIM"
    clusterName = "DEFAULT"

[transport.grpc.server]
    addr = ":0"

[log]
    level = "info"
    terminals = ["console"]
