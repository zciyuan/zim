# ZIM transfer bootstrap configuration.
# Run: ./build/bin/zim-transfer -etc ./configs/zim-transfer

pid = "./run/zim-transfer.pid"
mode = "debug"
timezone = "Local"
shutdownMaxWaitTime = "30s"

[zim.health]
    addr = ":8205"

[zim.postgres]
    dsn = "postgres://zim:zim@127.0.0.1:5432/zim?sslmode=disable"

[zim.mongo]
    uri = "mongodb://127.0.0.1:27017/zim"
    database = "zim"

[zim.degrade]
    kafka = false

[zim.pipe]
    brokers = ["127.0.0.1:9092"]
# Same-group consumers per topic; topics have 24 partitions.
consumersPerTopic = 16

[zim.transfer]
    # Conversation-shard workers; each conversation stays on one worker to
    # preserve seq/order. 256 supports ~256 concurrently active conversations.
    workers = 256

[locate.redis]
    addrs = ["127.0.0.1:6379"]
    prefix = "zim"

[log]
    level = "info"
    terminals = ["console"]
