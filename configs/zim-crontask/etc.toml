# ZIM crontask bootstrap configuration.
# Run: ./build/bin/zim-crontask -etc ./configs/zim-crontask

pid = "./run/zim-crontask.pid"
mode = "debug"
timezone = "Local"
shutdownMaxWaitTime = "30s"

[zim.health]
    addr = ":8206"

[zim.crontask]
    interval = "1h"

[zim.burn]
    # 阅后即焚定时扫除（ADR-0043）：物理擦除到期消息 + 1911 推送 + 媒体清理事件。
    sweepInterval = "5s"

[zim.gateclean]
    # Reclaim stale locations of gateways that are no longer registered (ADR-0022).
    interval = "30s"

[registry.nacos]
    urls = ["http://127.0.0.1:8848/nacos"]
    namespaceId = ""
    groupName = "ZIM"
    clusterName = "DEFAULT"

[zim.message]
    # Retention for Mongo message blocks.
    retention = "720h"

[zim.postgres]
    dsn = "postgres://zim:zim@127.0.0.1:5432/zim?sslmode=disable"

[zim.mongo]
    uri = "mongodb://127.0.0.1:27017/zim"
    database = "zim"

[lock.redis]
    addrs = ["127.0.0.1:6379"]
    prefix = "zim:lock"
[locate.redis]
    addrs = ["127.0.0.1:6379"]
    prefix = "zim"

[log]
    level = "info"
    terminals = ["console"]

[zim.pipe]
    brokers = ["kafka:9092"]
