name: zim-mongo-shard

# Isolated sharded MongoDB for T11 verification. The normal dev stack keeps a
# single mongod; this file proves the composite shard key and distribution
# without changing application startup.
services:
  cfg:
    image: mongo:7
    command: ["mongod", "--configsvr", "--replSet", "cfg", "--bind_ip_all", "--port", "27017"]
    ports:
      - "27020:27017"
    volumes:
      - cfg-data:/data/db

  shard1:
    image: mongo:7
    command: ["mongod", "--shardsvr", "--replSet", "sh1", "--bind_ip_all", "--port", "27017"]
    ports:
      - "27021:27017"
    volumes:
      - shard1-data:/data/db

  shard2:
    image: mongo:7
    command: ["mongod", "--shardsvr", "--replSet", "sh2", "--bind_ip_all", "--port", "27017"]
    ports:
      - "27022:27017"
    volumes:
      - shard2-data:/data/db

  mongos:
    image: mongo:7
    command: ["mongos", "--configdb", "cfg/cfg:27017", "--bind_ip_all", "--port", "27017"]
    depends_on: [cfg, shard1, shard2]
    ports:
      - "27023:27017"

  init:
    image: mongo:7
    depends_on: [cfg, shard1, shard2, mongos]
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -eu
        until mongosh --quiet --host cfg:27017 --eval 'db.adminCommand({ping:1}).ok' >/dev/null 2>&1; do sleep 1; done
        mongosh --quiet --host cfg:27017 --eval 'rs.initiate({_id:"cfg",configsvr:true,members:[{_id:0,host:"cfg:27017"}]})' || true
        sleep 3
        for shard in sh1:shard1 sh2:shard2; do
          id=$${shard%%:*}; host=$${shard#*:}
          until mongosh --quiet --host "$$host:27017" --eval 'db.adminCommand({ping:1}).ok' >/dev/null 2>&1; do sleep 1; done
          mongosh --quiet --host "$$host:27017" --eval "rs.initiate({_id:'$$id',members:[{_id:0,host:'$$host:27017'}]})" || true
        done
        sleep 5
        until mongosh --quiet --host mongos:27017 --eval 'db.adminCommand({ping:1}).ok' >/dev/null 2>&1; do sleep 1; done
        mongosh --quiet --host mongos:27017 --eval 'sh.addShard("sh1/shard1:27017"); sh.addShard("sh2/shard2:27017"); sh.enableSharding("zim"); sh.shardCollection("zim.msg", {conversation_id:"hashed", block_idx:1});'
        mongosh --quiet --host mongos:27017 --eval 'const d=db.getSiblingDB("zim"); for(let i=0;i<200;i++){d.msg.insertOne({conversation_id:"c_"+i,block_idx:0,msgs:[]})}; printjson(d.msg.getShardDistribution()); printjson(d.msg.find({conversation_id:"c_1"}).explain("executionStats").queryPlanner.winningPlan);'
    restart: "no"

volumes:
  cfg-data:
  shard1-data:
  shard2-data:
