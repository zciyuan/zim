# ZIM zim-wallet bootstrap configuration (compose dev stack).
# Run: ./build/bin/zim-wallet -etc ./configs/zim-wallet

pid = "./run/zim-wallet.pid"
mode = "debug"
timezone = "Local"
shutdownMaxWaitTime = "30s"

[zim.health]
    addr = ":8211"

[zim.wallet]
    # 0024_wallet.up.sql 在 zim 库内创建独立 wallet schema。
    dsn = "postgres://zim:zim@postgres:5432/zim?sslmode=disable"
    minWithdraw = 1000000
    maxSmallWithdraw = 500000000
    freezeWindowMs = 86400000
    feeBps = 500
    maintenanceInterval = "1m"

[zim.wallet.confirmations]
    trc20 = 20
    erc20 = 12
    bep20 = 15

[locate.redis]
    addrs = ["redis:6379"]
    prefix = "zim"

[lock.redis]
    addrs = ["redis:6379"]
    prefix = "zim:lock"

[zim.pipe]
    brokers = ["kafka:9092"]

[cluster.mesh]
    name = "wallet"
    addr = ":0"
    codec = "proto"

[registry.nacos]
    urls = ["http://nacos:8848/nacos"]
    namespaceId = ""
    groupName = "ZIM"
    clusterName = "DEFAULT"

[transport.grpc.server]
    addr = ":0"

[log]
    level = "info"
    terminals = ["console"]
