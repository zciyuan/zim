# ZIM node-conv bootstrap configuration.
# Run: ./build/bin/zim-node-conv -etc ./configs/zim-node-conv

pid = "./run/zim-node-conv.pid"
mode = "debug"
timezone = "Local"
shutdownMaxWaitTime = "30s"

[zim.health]
    addr = ":8103"

[zim.postgres]
    dsn = "postgres://zim:zim@postgres:5432/zim?sslmode=disable"

[zim.mongo]
    uri = "mongodb://mongo:27017/zim"
    database = "zim"

[cluster.node]
    name = "node-conv"
    addr = ":0"
    codec = "proto"

[locate.redis]
    addrs = ["redis:6379"]
    prefix = "zim"

[registry.nacos]
    urls = ["http://nacos:8848/nacos"]
    namespaceId = ""
    groupName = "ZIM"
    clusterName = "DEFAULT"

[log]
    level = "info"
    terminals = ["console"]
