# ZIM aggregated mesh bootstrap configuration.
# Run: ./build/bin/zim-mesh -etc ./configs/zim-mesh

pid = "./run/zim-mesh.pid"
mode = "debug"
timezone = "Local"
shutdownMaxWaitTime = "30s"

[zim.health]
    addr = ":8206"

[zim.auth]
    secret = "dev-only-zim-secret-change-me"
    accessTTL = "168h"
    refreshTTL = "2160h"

[zim.postgres]
    dsn = "postgres://zim:zim@postgres:5432/zim?sslmode=disable"

[zim.mongo]
    uri = "mongodb://mongo:27017/zim"
    database = "zim"

[locate.redis]
    addrs = ["redis:6379"]
    prefix = "zim"

[cluster.mesh]
    name = "mesh"
    addr = ":0"
    codec = "proto"

[registry.nacos]
    urls = ["http://nacos:8848/nacos"]
    namespaceId = ""
    groupName = "ZIM"
    clusterName = "DEFAULT"

[transport.grpc.server]
    addr = ":0"

[log]
    level = "info"
    terminals = ["console"]
