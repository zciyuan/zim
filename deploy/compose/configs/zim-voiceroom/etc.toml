# ZIM zim-voiceroom bootstrap configuration (compose dev stack).
# Run: ./build/bin/zim-voiceroom -etc ./configs/zim-voiceroom

pid = "./run/zim-voiceroom.pid"
mode = "debug"
timezone = "Local"
shutdownMaxWaitTime = "30s"

[zim.health]
    addr = ":8208"

[zim.postgres]
    dsn = "postgres://zim:zim@postgres:5432/zim?sslmode=disable"

[zim.voiceroom]
    seatCount = 8
    reconnectTimeoutMs = 30000
    emptyTimeoutMs = 300000
    roomTTL = "168h"
    sfuUrl = "ws://192.168.6.88:7880"
    webhookAddr = ":8210"
    webhookSecret = "zimdevsecret012345678901234567890123456789"
    livekitUrl = "http://livekit:7880"
    livekitApiKey = "devkey"
    livekitApiSecret = "zimdevsecret012345678901234567890123456789"
    livekitTokenTTL = "1h"

[locate.redis]
    addrs = ["redis:6379"]
    prefix = "zim"

[zim.pipe]
    brokers = ["kafka:9092"]

[cluster.mesh]
    name = "voiceroom"
    addr = ":0"
    codec = "proto"

[registry.nacos]
    urls = ["http://nacos:8848/nacos"]
    namespaceId = ""
    groupName = "ZIM"
    clusterName = "DEFAULT"

[transport.grpc.server]
    addr = ":0"

[log]
    level = "info"
    terminals = ["console"]
