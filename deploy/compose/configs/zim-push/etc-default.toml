# ZIM push bootstrap configuration.
# Run: ./build/bin/zim-push -etc ./configs/zim-push

pid = "./run/zim-push.pid"
mode = "debug"
timezone = "Local"
shutdownMaxWaitTime = "30s"

[zim.health]
    addr = ":8204"

[zim.push]
    latencyWarnMs = 200

[zim.degrade]
    kafka = false

[zim.pipe]
    brokers = ["kafka:9092"]
    pushConsumers = 8

[cluster.node]
    name = "push"
    addr = ":0"
    codec = "proto"

[locate.redis]
    addrs = ["redis:6379"]
    prefix = "zim"

[registry.nacos]
    urls = ["http://nacos:8848/nacos"]
    namespaceId = ""
    groupName = "ZIM"
    clusterName = "DEFAULT"

[transport.grpc.server]
    addr = ":0"

[log]
    level = "info"
    terminals = ["console"]
