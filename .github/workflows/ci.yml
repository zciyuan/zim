name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check no public addresses in deploy/config/docs
        run: bash deploy/scripts/check-internal-addresses.sh

      - uses: actions/setup-go@v5
        with:
          go-version: "1.27.x"
          cache-dependency-path: |
            go.sum
            zimfw/go.sum

      - name: Download modules
        run: |
          go mod download
          (cd zimfw && go mod download)

      - name: Test root module
        run: go test -race -count=1 ./...

      - name: Test framework module
        run: cd zimfw && go test -race -count=1 -cover ./...

      - name: Lint
        run: |
          go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.15.0
          golangci-lint run --timeout=5m ./...
          (cd zimfw && golangci-lint run --timeout=5m ./...)

      - name: Build all 11 binaries
        run: |
          go install github.com/magefile/mage@v1.17.2
          mage configCheck
          mage build
          test "$(find build/bin -maxdepth 1 -type f | wc -l)" -eq 11
